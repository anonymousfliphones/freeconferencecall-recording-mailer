name = "fcc-mailer-trigger"
main = "src/index.js"
compatibility_date = "2026-08-28"

# Fires every hour at :04, matching the GitHub Actions workflow's intended
# cadence. Independent of GitHub's own (currently unreliable) `schedule`
# trigger -- this Worker just calls GitHub's workflow_dispatch API instead.
[triggers]
crons = ["4 * * * *"]
